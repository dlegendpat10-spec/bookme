<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings — Bookmi Admin</title>
  <meta name="description" content="View and manage all customer appointments on Bookmi.">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
<div class="admin-layout">

  <!-- ── SIDEBAR ─────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark" aria-hidden="true" data-business-initials>BT</div>
      <div class="sidebar-logo-text">Book<span>mi</span></div>
    </div>
    <nav class="sidebar-nav" role="navigation">
      <a href="dashboard.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="bookings.html" class="nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
        Bookings
      </a>
      <a href="customers.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Customers
      </a>
      <a href="services.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
        Services
      </a>
      <a href="availability.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Availability
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" tabindex="0" role="button" onclick="if(confirm('Sign out?')) API.logout()">
        <div class="sidebar-avatar" id="sidebar-avatar">DA</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Deji Ayomide</div>
          <div class="sidebar-user-role">Administrator</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- MAIN -->
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left">
        <div class="admin-page-title">Bookings</div>
        <div class="admin-breadcrumb">Manage all appointments</div>
      </div>
      <div class="admin-header-right">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <a href="../book.html" class="btn btn-primary btn-sm" target="_blank">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Booking
        </a>
      </div>
    </header>

    <div class="admin-content">

      <!-- Filters row -->
      <div class="filters-row" role="search" aria-label="Filter bookings">
        <div class="search-bar" style="max-width:280px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search-input" placeholder="Search bookings, customers…" aria-label="Search bookings">
        </div>
        <div class="filter-chips" role="group" aria-label="Filter by status">
          <button class="filter-chip active" data-status="" aria-pressed="true">All</button>
          <button class="filter-chip" data-status="PENDING" aria-pressed="false">Pending</button>
          <button class="filter-chip" data-status="CONFIRMED" aria-pressed="false">Confirmed</button>
          <button class="filter-chip" data-status="COMPLETED" aria-pressed="false">Completed</button>
          <button class="filter-chip" data-status="CANCELLED" aria-pressed="false">Cancelled</button>
        </div>
        <div style="margin-left:auto;display:flex;gap:.5rem;align-items:center">
          <label for="date-filter" class="form-label" style="margin:0;white-space:nowrap;font-size:.8rem">Date:</label>
          <input type="date" id="date-filter" class="form-input" style="width:auto;padding:.4rem .75rem;font-size:.8125rem" aria-label="Filter by date">
          <button class="btn btn-ghost btn-sm" id="clear-date" aria-label="Clear date filter">×</button>
        </div>
      </div>

      <!-- Bookings count -->
      <div class="bookings-meta" role="status" aria-live="polite">
        Showing <strong id="count-shown">0</strong> of <strong id="count-total">0</strong> bookings
      </div>

      <!-- Table -->
      <div class="table-wrapper" id="bookings-table-wrapper">
        <div class="book-loading" style="padding:2rem"><div class="spinner"></div><span>Loading bookings…</span></div>
      </div>

    </div>
  </div>
</div>

<!-- Status Update Modal -->
<dialog id="status-modal" aria-labelledby="status-modal-title">
  <div class="modal-header">
    <h2 class="modal-title" id="status-modal-title">Update Booking Status</h2>
    <button class="modal-close" aria-label="Close" onclick="APP.closeModal('status-modal')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <div class="modal-booking-info" id="modal-booking-info"></div>
    <div class="form-group">
      <label class="form-label" for="new-status">New Status</label>
      <select class="form-select" id="new-status" aria-label="Select new booking status">
        <option value="PENDING">Pending</option>
        <option value="CONFIRMED">Confirmed</option>
        <option value="COMPLETED">Completed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="APP.closeModal('status-modal')">Cancel</button>
    <button class="btn btn-primary" id="update-status-btn">Update Status</button>
  </div>
</dialog>

<div id="toast-container" aria-live="polite" aria-atomic="false"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
API.requireAuth();

let allBookings = [];
let allCustomers = [];
let selectedBookingId = null;
let activeStatus = '';
let searchQuery = '';
let dateFilter = '';

async function loadBookings() {
  const [{ data: bks }, { data: custs }] = await Promise.all([API.getBookings(), API.getCustomers()]);
  allBookings  = bks || [];
  allCustomers = custs || [];
  renderTable();
}

function getFiltered() {
  return allBookings.filter(b => {
    const cust = allCustomers.find(c => c.id === b.customer_id) || {};
    const name = `${cust.first_name || ''} ${cust.last_name || ''}`.toLowerCase();
    const q    = searchQuery.toLowerCase();
    const matchSearch = !q || name.includes(q) || (b.booking_reference||'').toLowerCase().includes(q) || (cust.email||'').toLowerCase().includes(q);
    const matchStatus = !activeStatus || b.status === activeStatus;
    const matchDate   = !dateFilter  || b.booking_date === dateFilter;
    return matchSearch && matchStatus && matchDate;
  });
}

function renderTable() {
  const filtered = getFiltered();
  document.getElementById('count-shown').textContent = filtered.length;
  document.getElementById('count-total').textContent = allBookings.length;
  const wrapper = document.getElementById('bookings-table-wrapper');

  if (!filtered.length) {
    wrapper.innerHTML = `<div class="empty-state"><div class="empty-state-icon" aria-hidden="true">🗓️</div><p class="text-sm text-muted">No bookings match your filters.</p></div>`;
    return;
  }
  const rows = filtered.map(b => {
    const cust = allCustomers.find(c => c.id === b.customer_id) || {};
    const svcId = b.service_id;
    return `<tr>
      <td>
        <div style="font-weight:600;font-size:.875rem">${APP.escapeHtml(b.booking_reference)}</div>
        <div style="font-size:.75rem;color:var(--text-faint)">${API.formatDate(b.created_at?.split('T')[0]||'')}</div>
      </td>
      <td>
        <div style="font-weight:600">${APP.escapeHtml(cust.first_name||'')} ${APP.escapeHtml(cust.last_name||'')}</div>
        <div style="font-size:.75rem;color:var(--text-muted)">${APP.escapeHtml(cust.email||'')}</div>
      </td>
      <td style="font-size:.875rem">${API.formatDate(b.booking_date)}</td>
      <td style="font-size:.875rem;white-space:nowrap">${API.formatTime(b.start_time)} — ${API.formatTime(b.end_time)}</td>
      <td>${APP.statusBadge(b.status)}</td>
      <td>
        <button class="btn btn-secondary btn-sm update-btn" data-id="${b.id}" data-status="${b.status}" aria-label="Update status of booking ${APP.escapeHtml(b.booking_reference)}">
          Update
        </button>
      </td>
    </tr>`;
  }).join('');

  wrapper.innerHTML = `<table>
    <thead><tr>
      <th>Reference</th><th>Customer</th><th>Date</th><th>Time</th><th>Status</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  wrapper.querySelectorAll('.update-btn').forEach(btn => {
    btn.addEventListener('click', () => openStatusModal(btn.dataset.id, btn.dataset.status));
  });
}

function openStatusModal(id, currentStatus) {
  selectedBookingId = id;
  const b = allBookings.find(b => b.id === id);
  const cust = allCustomers.find(c => c.id === b?.customer_id) || {};
  document.getElementById('modal-booking-info').innerHTML = `
    <div style="background:var(--surface-3);border-radius:var(--r-md);padding:1rem;margin-bottom:.5rem">
      <div style="font-weight:700;margin-bottom:.25rem">${APP.escapeHtml(cust.first_name||'')} ${APP.escapeHtml(cust.last_name||'')}</div>
      <div style="font-size:.8125rem;color:var(--text-muted)">${API.formatDate(b.booking_date)} at ${API.formatTime(b.start_time)}</div>
      <div style="margin-top:.5rem">${APP.statusBadge(currentStatus)}</div>
    </div>`;
  document.getElementById('new-status').value = currentStatus;
  APP.openModal('status-modal');
}

document.getElementById('update-status-btn').addEventListener('click', async () => {
  const btn = document.getElementById('update-status-btn');
  const newStatus = document.getElementById('new-status').value;
  APP.setButtonLoading(btn, true);
  const { error } = await API.updateBookingStatus(selectedBookingId, newStatus);
  APP.setButtonLoading(btn, false);
  if (error) { APP.showToast(error, 'error'); return; }
  // Update local state
  const idx = allBookings.findIndex(b => b.id === selectedBookingId);
  if (idx !== -1) allBookings[idx].status = newStatus;
  APP.closeModal('status-modal');
  renderTable();
  APP.showToast(`Booking updated to ${newStatus.charAt(0) + newStatus.slice(1).toLowerCase()}`, 'success');
});

// Filter chips
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed','false'); });
    chip.classList.add('active');
    chip.setAttribute('aria-pressed','true');
    activeStatus = chip.dataset.status;
    renderTable();
  });
});

// Search
let searchTimeout;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { searchQuery = e.target.value; renderTable(); }, 250);
});

// Date filter
document.getElementById('date-filter').addEventListener('change', e => { dateFilter = e.target.value; renderTable(); });
document.getElementById('clear-date').addEventListener('click', () => {
  document.getElementById('date-filter').value = '';
  dateFilter = ''; renderTable();
});

loadBookings();
</script>

<style>
.filters-row {
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.filter-chips { display: flex; gap: .375rem; flex-wrap: wrap; }
.filter-chip {
  padding: .375rem .875rem;
  border-radius: var(--r-full);
  font-size: .8rem; font-weight: 600;
  color: var(--text-muted);
  background: var(--surface-2);
  border: 1px solid var(--border);
  transition: all var(--ease-fast);
  cursor: pointer;
}
.filter-chip:hover { border-color: var(--border-md); color: var(--text); }
.filter-chip.active {
  background: var(--accent-dim);
  border-color: rgba(124 58 237 / .4);
  color: var(--accent-lt);
}
.bookings-meta {
  font-size: .8125rem; color: var(--text-faint);
  margin-top: -.5rem;
}
.modal-booking-info { margin-bottom: .25rem; }
.book-loading { display: flex; align-items: center; gap: .75rem; color: var(--text-muted); font-size: .875rem; }
</style>
</body>
</html>
