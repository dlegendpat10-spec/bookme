<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — Bookmi Admin</title>
  <meta name="description" content="View and manage customer directory on Bookmi.">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
<div class="admin-layout">
  <!-- ── SIDEBAR ─────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark" aria-hidden="true" data-business-initials>BM</div>
      <div class="sidebar-logo-text">Book<span>mi</span></div>
    </div>
    <nav class="sidebar-nav" role="navigation">
      <a href="dashboard.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="bookings.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Bookings</a>
      <a href="customers.html" class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Customers</a>
      <a href="services.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>Services</a>
      <a href="availability.html" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Availability</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" tabindex="0" role="button" onclick="if(confirm('Sign out?')) API.logout()">
        <div class="sidebar-avatar" id="sidebar-avatar">AU</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin User</div>
          <div class="sidebar-user-role">Administrator</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- MAIN -->
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left">
        <div class="admin-page-title">Customers</div>
        <div class="admin-breadcrumb">Manage your client directory</div>
      </div>
      <div class="admin-header-right">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="btn btn-primary btn-sm" id="add-customer-btn" aria-label="Add new customer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Customer
        </button>
      </div>
    </header>

    <div class="admin-content">
      <!-- Search row -->
      <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
        <div class="search-bar" style="max-width:320px;flex:1">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search-input" placeholder="Search by name, email or phone…" aria-label="Search customers">
        </div>
        <span class="text-muted text-sm" role="status" aria-live="polite">
          <strong id="count-label">0</strong> customers
        </span>
      </div>

      <!-- Customer cards grid -->
      <div class="customers-grid" id="customers-grid" aria-label="Customers list">
        <div class="book-loading" style="padding:2rem"><div class="spinner"></div><span>Loading customers…</span></div>
      </div>
    </div>
  </div>
</div>

<!-- Add / Edit Customer Modal -->
<dialog id="customer-modal" aria-labelledby="customer-modal-title">
  <div class="modal-header">
    <h2 class="modal-title" id="customer-modal-title">Add Customer</h2>
    <button class="modal-close" aria-label="Close dialog" onclick="APP.closeModal('customer-modal')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <form id="customer-modal-form" novalidate>
      <input type="hidden" id="edit-customer-id">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group">
          <label class="form-label" for="m-first-name">First name <span class="required" aria-hidden="true">*</span></label>
          <input class="form-input" type="text" id="m-first-name" required placeholder="First name">
        </div>
        <div class="form-group">
          <label class="form-label" for="m-last-name">Last name <span class="required" aria-hidden="true">*</span></label>
          <input class="form-input" type="text" id="m-last-name" required placeholder="Last name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="m-email">Email <span class="required" aria-hidden="true">*</span></label>
        <input class="form-input" type="email" id="m-email" required placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="m-phone">Phone</label>
        <input class="form-input" type="tel" id="m-phone" placeholder="+234 800 000 0000">
      </div>
      <div class="form-group">
        <label class="form-label" for="m-notes">Notes</label>
        <textarea class="form-textarea" id="m-notes" rows="2" placeholder="Internal notes about this customer…"></textarea>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="APP.closeModal('customer-modal')">Cancel</button>
    <button class="btn btn-primary" id="save-customer-btn">Save Customer</button>
  </div>
</dialog>

<!-- Customer Detail Panel -->
<dialog id="detail-modal" aria-labelledby="detail-modal-title" style="max-width:640px">
  <div class="modal-header">
    <h2 class="modal-title" id="detail-modal-title">Customer Profile</h2>
    <button class="modal-close" aria-label="Close" onclick="APP.closeModal('detail-modal')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-body" id="detail-modal-body" style="gap:1.5rem"></div>
  <div class="modal-footer">
    <button class="btn btn-secondary" id="edit-from-detail-btn">Edit</button>
    <button class="btn btn-secondary" onclick="APP.closeModal('detail-modal')">Close</button>
  </div>
</dialog>

<div id="toast-container" aria-live="polite" aria-atomic="false"></div>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
API.requireAuth();

let allCustomers = [];
let allBookings  = [];
let searchQ = '';
let currentEditId = null;

async function load() {
  const [{ data: custs }, { data: bks }] = await Promise.all([API.getCustomers(), API.getBookings()]);
  allCustomers = custs || [];
  allBookings  = bks  || [];
  render();
}

function render() {
  const q = searchQ.toLowerCase();
  const filtered = allCustomers.filter(c => {
    const name = `${c.first_name} ${c.last_name}`.toLowerCase();
    return !q || name.includes(q) || c.email.toLowerCase().includes(q) || (c.phone||'').includes(q);
  });
  document.getElementById('count-label').textContent = filtered.length;
  const grid = document.getElementById('customers-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon" aria-hidden="true">👥</div><p class="text-sm text-muted">No customers found.</p><button class="btn btn-primary btn-sm" onclick="document.getElementById('add-customer-btn').click()">Add First Customer</button></div>`;
    return;
  }
  grid.innerHTML = filtered.map(c => {
    const bkCount = allBookings.filter(b => b.customer_id === c.id && b.status !== 'CANCELLED').length;
    const initials = `${c.first_name[0]}${c.last_name[0]}`;
    return `<article class="customer-card" data-id="${c.id}" tabindex="0" role="button" aria-label="View ${APP.escapeHtml(c.first_name)} ${APP.escapeHtml(c.last_name)}'s profile">
      <div class="customer-avatar" aria-hidden="true">${APP.escapeHtml(initials)}</div>
      <div class="customer-info">
        <div class="customer-name">${APP.escapeHtml(c.first_name)} ${APP.escapeHtml(c.last_name)}</div>
        <div class="customer-email">${APP.escapeHtml(c.email)}</div>
        ${c.phone ? `<div class="customer-phone">${APP.escapeHtml(c.phone)}</div>` : ''}
      </div>
      <div class="customer-meta">
        <span class="tag">${bkCount} booking${bkCount !== 1 ? 's' : ''}</span>
      </div>
      <div class="customer-actions">
        <button class="btn btn-secondary btn-sm view-btn" data-id="${c.id}" aria-label="View ${APP.escapeHtml(c.first_name)}'s profile">View</button>
        <button class="btn btn-ghost btn-sm edit-btn" data-id="${c.id}" aria-label="Edit ${APP.escapeHtml(c.first_name)}'s details">Edit</button>
      </div>
    </article>`;
  }).join('');

  grid.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); openDetail(btn.dataset.id); }));
  grid.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); openEdit(btn.dataset.id); }));
  grid.querySelectorAll('.customer-card').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.id));
    card.addEventListener('keydown', e => { if (e.key === 'Enter') openDetail(card.dataset.id); });
  });
}

function openDetail(id) {
  const c = allCustomers.find(c => c.id === id);
  if (!c) return;
  currentEditId = id;
  const bks = allBookings.filter(b => b.customer_id === id).sort((a,b) => b.booking_date.localeCompare(a.booking_date));
  const initials = `${c.first_name[0]}${c.last_name[0]}`;
  document.getElementById('detail-modal-body').innerHTML = `
    <div style="display:flex;align-items:center;gap:1rem">
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg in oklch,var(--accent-lt),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:800;color:#fff;flex-shrink:0" aria-hidden="true">${APP.escapeHtml(initials)}</div>
      <div>
        <div style="font-size:1.25rem;font-weight:800;letter-spacing:-0.02em">${APP.escapeHtml(c.first_name)} ${APP.escapeHtml(c.last_name)}</div>
        <div style="color:var(--text-muted);font-size:.875rem">${APP.escapeHtml(c.email)}</div>
        ${c.phone ? `<div style="color:var(--text-muted);font-size:.875rem">${APP.escapeHtml(c.phone)}</div>` : ''}
      </div>
    </div>
    ${c.notes ? `<div style="background:var(--surface-3);border-radius:var(--r-md);padding:.875rem 1rem;font-size:.875rem;color:var(--text-muted)">${APP.escapeHtml(c.notes)}</div>` : ''}
    <div>
      <div style="font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:.875rem">Booking History (${bks.length})</div>
      ${!bks.length ? '<p class="text-sm text-muted">No bookings yet.</p>' :
        `<div style="display:flex;flex-direction:column;gap:.5rem">
          ${bks.map(b => `<div style="display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;background:var(--surface-3);border-radius:var(--r-md);font-size:.8125rem">
            <div>
              <span style="font-weight:600">${API.formatDate(b.booking_date)}</span>
              <span style="color:var(--text-muted);margin-left:.5rem">at ${API.formatTime(b.start_time)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:.625rem">
              <span style="font-family:var(--font-mono);color:var(--text-faint);font-size:.75rem">${APP.escapeHtml(b.booking_reference)}</span>
              ${APP.statusBadge(b.status)}
            </div>
          </div>`).join('')}
        </div>`
      }
    </div>`;
  document.getElementById('edit-from-detail-btn').onclick = () => { APP.closeModal('detail-modal'); openEdit(id); };
  APP.openModal('detail-modal');
}

function openEdit(id) {
  const c = id ? allCustomers.find(c => c.id === id) : null;
  currentEditId = id || null;
  document.getElementById('customer-modal-title').textContent = c ? 'Edit Customer' : 'Add Customer';
  document.getElementById('edit-customer-id').value = id || '';
  document.getElementById('m-first-name').value = c?.first_name || '';
  document.getElementById('m-last-name').value  = c?.last_name  || '';
  document.getElementById('m-email').value       = c?.email     || '';
  document.getElementById('m-phone').value       = c?.phone     || '';
  document.getElementById('m-notes').value       = c?.notes     || '';
  APP.openModal('customer-modal');
}

document.getElementById('add-customer-btn').addEventListener('click', () => openEdit(null));
document.getElementById('save-customer-btn').addEventListener('click', async () => {
  const form = document.getElementById('customer-modal-form');
  if (!form.checkValidity()) { APP.showToast('Please fill required fields.', 'warning'); return; }
  const btn = document.getElementById('save-customer-btn');
  APP.setButtonLoading(btn, true);
  const payload = {
    first_name: document.getElementById('m-first-name').value.trim(),
    last_name:  document.getElementById('m-last-name').value.trim(),
    email:      document.getElementById('m-email').value.trim(),
    phone:      document.getElementById('m-phone').value.trim(),
    notes:      document.getElementById('m-notes').value.trim(),
  };
  const id = document.getElementById('edit-customer-id').value;
  const { error } = id ? await API.updateCustomer(id, payload) : await API.createCustomer(payload);
  APP.setButtonLoading(btn, false);
  if (error) { APP.showToast(error, 'error'); return; }
  APP.closeModal('customer-modal');
  APP.showToast(id ? 'Customer updated.' : 'Customer added.', 'success');
  await load();
});

let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchQ = e.target.value; render(); }, 250);
});

load();
</script>

<style>
.customers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
}
.customer-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: .875rem;
  transition: all var(--ease-base);
  cursor: pointer;
  position: relative;
}
.customer-card:hover { border-color: var(--border-md); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.customer-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.customer-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg in oklch, var(--accent-lt), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; font-weight: 800; color: #fff;
}
.customer-name  { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: .2rem; }
.customer-email { font-size: .8125rem; color: var(--text-muted); }
.customer-phone { font-size: .8125rem; color: var(--text-faint); margin-top: .1rem; }
.customer-meta  { margin-top: -.125rem; }
.customer-actions { display: flex; gap: .5rem; }
.book-loading { display: flex; align-items: center; gap: .75rem; color: var(--text-muted); font-size: .875rem; }
</style>
</body>
</html>
