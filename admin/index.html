<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Bookme</title>
  <meta name="description" content="Administrator login for Bookme booking management.">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>

<div class="mesh-bg" aria-hidden="true"></div>

<main class="login-main" id="main-content">
  <div class="login-wrapper">

    <!-- Logo -->
    <div class="login-logo animate-fade-up">
      <div class="login-logo-mark" aria-hidden="true" data-business-initials>BT</div>
      <div>
        <div class="login-brand">Book<span>me</span></div>
        <div class="login-brand-sub">Admin Portal</div>
      </div>
    </div>

    <!-- Card -->
    <div class="login-card animate-fade-up delay-100" role="region" aria-labelledby="login-heading">
      <h1 id="login-heading" class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to manage your bookings and services.</p>

      <form class="login-form" id="login-form" novalidate aria-label="Login form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email address</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input class="form-input" type="email" id="login-email" name="email" required
                   autocomplete="email" placeholder="admin@bookme.app" value="admin@bookme.app">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input class="form-input" type="password" id="login-password" name="password" required
                   autocomplete="current-password" placeholder="••••••••" value="admin123">
            <button type="button" class="input-icon-right" id="toggle-pw" aria-label="Toggle password visibility">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" id="eye-icon">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="login-error" class="login-error" role="alert" style="display:none"></div>

        <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn">
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="login-hint" aria-label="Demo credentials">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Demo: <code>admin@bookme.app</code> / <code>admin123</code>
      </div>
    </div>

    <a href="../index.html" class="login-back animate-fade-up delay-200">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to booking page
    </a>
  </div>
</main>

<div id="toast-container" aria-live="polite" aria-atomic="false"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
// Redirect if already logged in
if (API.getAuthUser()) window.location.href = 'dashboard.html';

// Toggle password visibility
document.getElementById('toggle-pw').addEventListener('click', () => {
  const input = document.getElementById('login-password');
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  document.getElementById('toggle-pw').setAttribute('aria-label', isText ? 'Show password' : 'Hide password');
});

// Login form
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  const btn = document.getElementById('login-btn');
  APP.setButtonLoading(btn, true);

  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  const { data, error } = await API.login(email, password);
  if (error || !data) {
    errEl.textContent = error || 'Login failed. Please try again.';
    errEl.style.display = 'flex';
    APP.setButtonLoading(btn, false);
    return;
  }
  APP.showToast(`Welcome back, ${data.full_name.split(' ')[0]}!`, 'success');
  setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
});
</script>

<style>
.login-main {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.login-wrapper {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
}
.login-logo {
  display: flex; align-items: center; gap: .875rem;
}
.login-logo-mark {
  width: 48px; height: 48px;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg in oklch, var(--accent-lt), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1rem; color: #fff;
  box-shadow: 0 6px 24px var(--accent-glow);
}
.login-brand { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.2; }
.login-brand span { color: var(--accent-lt); }
.login-brand-sub { font-size: .7rem; color: var(--text-faint); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }

.login-card {
  width: 100%;
  background: var(--surface-1);
  border: 1px solid var(--border-md);
  border-radius: var(--r-2xl);
  padding: 2rem;
  box-shadow: var(--shadow-lg), var(--shadow-inset);
}
.login-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: .375rem; }
.login-subtitle { font-size: .875rem; color: var(--text-muted); margin-bottom: 1.75rem; }

.login-form { display: flex; flex-direction: column; gap: 1rem; }

.w-full { width: 100%; }

.login-error {
  background: var(--danger-bg);
  border: 1px solid rgba(239 68 68 / .3);
  border-radius: var(--r-md);
  padding: .75rem 1rem;
  font-size: .875rem;
  color: var(--danger);
  display: flex;
  align-items: center;
  gap: .5rem;
}

.login-hint {
  margin-top: 1.25rem;
  padding: .75rem 1rem;
  background: var(--surface-3);
  border-radius: var(--r-md);
  font-size: .75rem;
  color: var(--text-faint);
  display: flex; align-items: center; gap: .5rem;
  flex-wrap: wrap;
}
.login-hint code {
  background: var(--surface-4); border-radius: var(--r-xs);
  padding: .1rem .375rem; font-family: var(--font-mono);
  color: var(--accent-lt); font-size: .7rem;
}

.login-back {
  display: flex; align-items: center; gap: .5rem;
  font-size: .875rem; color: var(--text-faint);
  transition: color var(--ease-fast);
}
.login-back:hover { color: var(--text); }
</style>
</body>
</html>
